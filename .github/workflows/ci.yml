name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --dev

    - name: Run tests
      run: uv run pytest --cov=fountain --cov-report=xml

    - name: Run linter
      run: uv run ruff check src/ tests/

    - name: Check formatting
      run: uv run ruff format --check src/ tests/

    - name: Run type checker
      run: uv run mypy src/

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  base-install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Set up Python
      run: uv python install 3.12

    - name: Install core only (no dev group, no pdf extra)
      run: uv sync --no-dev

    - name: Verify core parses Fountain text
      run: uv run --no-dev python -c "import fountain; from fountain import FountainParser; FountainParser().parse('INT. X - DAY')"

    - name: Verify fpdf is absent (zero-dependency core)
      run: |
        if uv run --no-dev python -c "import fpdf" 2>/dev/null; then
          echo "fpdf imported successfully but must be absent from the base install" >&2
          exit 1
        fi

  pdf:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies (dev group includes fpdf2)
      run: uv sync --dev

    - name: Run PDF test suite
      run: uv run pytest tests/test_pdf_renderer.py tests/test_pdf_geometry.py tests/test_pdf_profile.py

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --dev --group docs

    - name: Build package
      run: uv build

    - name: Verify wheel contents
      run: |
        uv run python -c "
        import glob, zipfile
        names = zipfile.ZipFile(sorted(glob.glob('dist/*.whl'))[-1]).namelist()
        print('\n'.join(names))
        required = ['fountain/__init__.py', 'fountain/parser.py', 'fountain/renderer.py', 'fountain/py.typed']
        missing = [path for path in required if path not in names]
        assert not missing, f'Wheel missing required files: {missing}'
        print('All required files present in wheel.')
        "

    - name: Run Sphinx doctests
      run: uv run sphinx-build -b doctest docs/source docs/build/doctest
