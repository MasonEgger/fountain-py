name: Test Publish to TestPyPI

# Manually-triggered dry run that builds and publishes to TestPyPI via trusted
# publishing, so install / README rendering / metadata can be validated before a
# real PyPI release. Never runs on release or push.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Set up Python
      run: uv python install 3.12

    - name: Build package
      run: uv build

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fountain-py
    permissions:
      id-token: write

    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Download distribution artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to TestPyPI
      run: uv publish --publish-url https://test.pypi.org/legacy/
