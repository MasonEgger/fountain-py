[project]
name = "fountain-py"
version = "0.3.0"
description = "A Python library for parsing Fountain markup, the screenwriting format"
readme = "README.md"
authors = [
    { name = "Mason Egger", email = "mason@masonegger.com" }
]
requires-python = ">=3.11"
dependencies = []
keywords = ["fountain", "screenplay", "screenwriting", "parser", "theater", "script"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Text Processing :: Markup",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
pdf = ["fpdf2>=2.7"]

[project.urls]
Homepage = "https://github.com/MasonEgger/fountain-py"
Repository = "https://github.com/MasonEgger/fountain-py"
Documentation = "https://masonegger.github.io/fountain-py/"
Issues = "https://github.com/MasonEgger/fountain-py/issues"

[project.scripts]
fountain = "fountain.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["src/fountain"]

[tool.hatch.build.targets.wheel.force-include]
"src/fountain/py.typed" = "fountain/py.typed"

[tool.hatch.build.targets.sdist]
exclude = [
    ".ai-sessions",
    "CLAUDE.md",
    "handoff.md",
    "plan.md",
    "todo.md",
    "spec.md",
    "commit-msg.md",
    "goal.md",
    ".github",
    "justfile",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
    "fpdf2>=2.7",
    "hypothesis>=6.169.0",
]
docs = [
    "sphinx>=7.0.0",
    "furo>=2023.5.20",
    "sphinx-autodoc-typehints>=1.23.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-autobuild>=2021.3.14",
    "myst-parser>=2.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "TC"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --doctest-modules"
testpaths = ["tests", "src"]
python_files = ["test_*.py", "*_test.py", "*.py"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
